name: Upload release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.4.3"
        required: true
        default: "v1.4.3"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          FILE="releases/群崽QunZai安装包-${TAG}.exe"
          echo "Uploading $FILE to $TAG"
          ls -l "$FILE"
          gh release upload "$TAG" "$FILE" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .size] | @tsv'
